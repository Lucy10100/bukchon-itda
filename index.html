<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>북촌을 잇다 - Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Noto+Serif+KR:wght@450&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Cafe24Moyamoya';
      src: url('./assets/font/Cafe24Moyamoya-Face-v1.0.woff2') format('woff2'),
           url('./assets/font/Cafe24Moyamoya-Face-v1.0.woff') format('woff');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    
    .moyamoya-font {
      font-family: 'Cafe24Moyamoya', sans-serif !important;
    }
  </style>
  <!-- <link rel="stylesheet" href="./assets/style.css"> -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'noto-serif': ['"Noto Serif KR"', 'serif'],
            'noto-sans': ['"Noto Sans"', 'sans-serif']
          }
        }
      }
    }
  </script>
</head>
<body class="text-center p-8 m-0 bg-gray-50 font-noto-sans">
  <div id="navigation" data-current-lang="kr"></div>
  <div class="kr flex flex-col sm:flex-row sm:gap-4 sm:justify-center">
    <img src="./assets/menu/kr_bagels.jpeg" alt="Korean Menu Bagels" 
         class="max-w-full w-full sm:w-1/3 sm:max-w-xs border border-gray-300 rounded-lg mx-auto my-2 shadow-sm" />
    <img src="./assets/menu/kr_etc.jpeg" alt="Korean Menu Etc" 
         class="max-w-full w-full sm:w-1/3 sm:max-w-xs border border-gray-300 rounded-lg mx-auto my-2 shadow-sm" />
    <img src="./assets/menu/kr_sandwich.jpeg" alt="Korean Menu Sandwich" 
         class="max-w-full w-full sm:w-1/3 sm:max-w-xs border border-gray-300 rounded-lg mx-auto my-2 shadow-sm" />
  </div>
  
  <script src="./assets/navigation.js"></script>
</body>
</html>
